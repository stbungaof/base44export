services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-converter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-converter}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-converter} -d ${POSTGRES_DB:-converter}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-converter}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-converter}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-512}
      MAX_UNCOMPRESSED_MB: ${MAX_UNCOMPRESSED_MB:-2048}
      VALIDATE_BUILD: ${VALIDATE_BUILD:-false}
    ports:
      - "${APP_PORT:-4000}:4000"
    volumes:
      # /data/{uploads,projects,output,logs,temp}
      - converter-data:/data

volumes:
  pgdata:
  converter-data:
